<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Aula 5 SENAC</title>

    


<style>
    html
    .conteiner{  /* caixa - uma box */
        width: 90%;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    .item{
        background-color: #5a5858;
        height: 350px;
        overflow: hidden;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
    }

    .item img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.75;
        transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .item:hover img{
        transform: scale(1.10);
        opacity: 0.95;
    }
    
       
   
        
      @media(max-width:768px) { /* seria melhor coloca a respansividade*/
        .conteiner{
            grid-template-columns: repeat(2,1fr); /* tamanho de tela , muda como num tablet/ verificar no google os tamanhos*/
        }

      }
       @media(max-width:360px) {
        .conteiner{
            grid-template-columns: repeat(1,1fr); /* tamanho de tela , muda como num tablet/ verificar no google os tamanhos*/
        }

      }
     


.cabecalho{
    width: 100%;
    height: 100px;
    margin: auto;
    display: flex; 
}

.caixa{
    flex: 1; 
    background-color: #829db2;
    border: 1px solid rgb(58, 58, 58);
    text-align: center;
    line-height: 100px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}
  .caixa img{
        width: 200px;
        height: 100px;
        object-fit: cover;
        opacity: 0.75;

  }
            
</style>
</head>
<body>

<div class="conteiner">
    <div class="item">
        <img src="imagens/foto 1.webp" alt="foto1">
        
    </div>
</div>
</body>
